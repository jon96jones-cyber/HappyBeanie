<tr>
  <td style="padding:13px 22px 4px 22px; font-family:'DM Sans', Arial, 'Helvetica Neue', Helvetica, sans-serif; font-size:14px; line-height:20px; color:#17140F;">{{item.title}}<br><span style="font-family:'DM Mono', 'Courier New', Courier, monospace; font-size:9.5px; letter-spacing:1.4px; text-transform:uppercase; color:#8A7F6E;">{{item.variant}} &times; {{item.quantity}}</span></td>
  <td align="right" valign="top" style="padding:13px 22px 4px 0; font-family:'DM Sans', Arial, 'Helvetica Neue', Helvetica, sans-serif; font-weight:500; font-size:14px; line-height:20px; color:#17140F; white-space:nowrap;">{{item.line_total}}</td>
</tr>
