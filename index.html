document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

px; align-items: center; max-width: 1180px; margin: 0 auto;\">\n      <div style=\"height: 520px; border-radius: 3px; overflow: hidden;\">\n        <image-slot id=\"hbv2-why\" placeholder=\"Owner and pet, quiet domestic moment\" style=\"width: 100%; height: 100%;\"><\u002Fimage-slot>\n      <\u002Fdiv>\n      <div>\n        <h2 style=\"font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: clamp(34px, 3.9vw, 58px); line-height: 1.04; letter-spacing: -0.042em; margin: 0 0 22px; text-wrap: balance;\">You have a recovery routine. <span style=\"color: oklch(0.44 0.07 152);\">Why doesn't your bean?<\u002Fspan><\u002Fh2>\n        <p style=\"font-size: 17px; line-height: 1.7; color: #554C40; margin: 0 0 34px; max-width: 32em; text-wrap: pretty;\">Cellular repair slows long before you see it — after spay and neuter, after injury, and steadily with age. Peptides are the short signalling chains that tell tissue to rebuild. Happy Beanie puts them in the five things your animal already does every day: eats, drinks, bathes, brushes, heals.<\u002Fp>\n        <div data-m=\"two\" style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid #D5CAB5;\">\n          <sc-for list=\"{{ stats }}\" as=\"s\" hint-placeholder-count=\"3\">\n            <div style=\"padding: 26px 18px 0 0;\">\n              <div style=\"font-family: 'DM Sans', sans-serif; font-weight: 700; letter-spacing: -0.042em; font-size: 46px; line-height: 1; margin-bottom: 8px;\">{{ s.n }}<\u002Fdiv>\n              <div style=\"font-size: 13px; line-height: 1.45; color: #6A6055;\">{{ s.label }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.06em; color: #8A7F6E; margin-top: 22px;\">*Self-reported owner survey, n=412. Individual results vary.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"formula\" data-m=\"pad shor ref }}\" target=\"_blank\" rel=\"noopener\" style=\"position: relative; display: inline-block; margin-top: 16px; font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: oklch(0.86 0.14 92); border-bottom: 1px solid oklch(0.86 0.14 92); padding-bottom: 2px;\" style-hover=\"color: #F5F0E6; border-color: #F5F0E6;\">Read on PubMed →<\u002Fa>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"position: relative; font-size: 13px; line-height: 1.65; color: #8A7F6E; margin: 26px 0 0; max-width: 52em;\">Published trials cited here evaluate the ingredient class our carriers are drawn from, not Happy Beanie as a finished product. We link the primary source so you can read the method and judge it yourself.<\u002Fp>\n      <\u002Fdiv>\n\n      <div data-m=\"stack gap\" style=\"display: grid; grid-template-columns: 0.95fr 1.05fr; gap: 60px; align-items: center; max-width: 1180px; margin: 88px auto 0;\">\n        <div data-m=\"auto\" style=\"height: 520px; border-radius: 5px; overflow: hidden; box-shadow: 0 34px 60px -38px rgba(23,20,15,0.5);\"><image-slot id=\"hbv2-pdp-story\" placeholder=\"Beanie, the dog this began with\" style=\"width: 100%; height: 100%;\"><\u002Fimage-slot><\u002Fdiv>\n        <div>\n          <div style=\"font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: oklch(0.44 0.07 152); margin-bottom: 20px;\">Why this exists<\u002Fdiv>\n          <h2 style=\"font-family: 'DM Sans', sans-serif; font-weight: 700; letter-spacing: -0.042em; font-size: clamp(30px, 3.4vw, 50px); line-height: 1.04; margin: 0 0 22px; max-width: 20em; text-wrap: balance;\">He stopped meeting me at the door.<\u002Fh2>\n          <p style=\"font-size: 16.5px; line-height: 1.72; color: #554C40; margin: 0 0 18px; max-width: 34em; text-wrap: pretty;\">Beanie was fourteen. Nothing was wrong on paper — bloodwork fine, no diagnosis, nothing to treat. He had just quietly stopped doing the things that made him him. The stairs became a decision. The greeting at the door became a look up from the rug.<\u002Fp>\n          <p style=\"font-size: 16.5px; line-height: 1.72; color: #554C40; margin: 0 0 26px; max-width: 34em; text-wrap: pretty;\">His owner is a compounding pharmacist. He spent a year reading canine trials instead of marketing copy, then blended the first batch on a borrowed bench for one dog. Eleven weeks later Beanie beat him to the door. Every tin since is that formula, published lot by lot.<\u002Fp>\n          <div style=\"display: flex; align-items: center; gap: 14px; padding-top: 22px; border-top: 1px solid #E0D6C2; font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: #8A7F6E;\"><span style=\"width: 26px; height: 1px; background: oklch(0.44 0.07 152);\"><\u002Fspan>Scottsdale, Arizona · since 2022<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"max-width: 1180px; margin: 72px auto 0;\">\n        <div style=\"font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: oklch(0.44 0.07 152); margin-bottom: 20px;\">Before you decide<\u002Fdiv>\n        <h2 style=\"font-family: 'DM Sans', sans-serif; font-weight: 700; letter-spacing: -0.042em; font-size: clamp(28px, 3.2vw, 44px); line-height: 1.05; margin: 0 0 32px; max-width: 22em;\">The questions owners ask us <span style=\"color: oklch(0.44 0.07 152);\">before the first tin.<\u002Fspan><\u002Fh2>\n        <div style=\"display: grid; gap: 0; border-top: 1px solid #E0D6C2;\">\n          <sc-for list=\"{{ faqs }}\" as=\"q\" hint-placeholder-count=\"4\">\n            <div style=\"border-bottom: 1px solid #E0D6C2;\">\n              <button sc-camel-on-click=\"{{ q.toggle }}\" style=\"width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 20px; text-align: left; padding: 22px 4px; background: transpa         <p style=\"font-size: 16px; line-height: 1.7; color: #B9AF9C; margin: 0 0 32px; max-width: 32em;\">If you do not see the change you were hoping for, tell us and we refund the order in full — opened, half-empty, no return shipment. We would rather earn the second month than argue about the first.<\u002Fp>\n            <div style=\"display: flex; gap: 14px; align-items: center; flex-wrap: wrap;\">\n              <button sc-camel-on-click=\"{{ cartCta }}\" style=\"font-family: 'DM Mono', monospace; font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; padding: 20px 36px; border: none; border-radius: 2px; background: oklch(0.86 0.14 92); color: #17140F; cursor: pointer; box-shadow: 0 20px 38px -22px oklch(0.86 0.14 92 / 0.6); transition: background 0.25s ease, transform 0.25s cubic-bezier(0.2,0.7,0.2,1);\" style-hover=\"background: #F5F0E6; transform: translateY(-2px);\">{{ cartLabel }}<\u002Fbutton>\n              <span style=\"font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: #8A7F6E;\">{{ planRecap }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display: flex; align-items: center; gap: 10px; margin-top: 20px; font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: oklch(0.72 0.08 152);\"><span style=\"width: 7px; height: 7px; border-radius: 50%; background: oklch(0.72 0.08 152);\"><\u002Fspan>Order today, ships within 24 hours from Scottsdale<\u002Fdiv>\n          <\u002Fdiv>\n          <div data-m=\"auto\" style=\"height: 320px; border-radius: 4px; overflow: hidden; box-shadow: 0 26px 60px rgba(0,0,0,0.5);\">\n            <image-slot id=\"hbv2-close\" placeholder=\"Pet mid-play, joyful, warm light\" style=\"width: 100%; height: 100%;\"><\u002Fimage-slot>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <div data-m=\"pad\" style=\"position: fixed; left: 0; right: 0; bottom: 0 <\u002Fdiv>\n      <div aria-hidden=\"true\" style=\"position: absolute; right: -140px; top: -180px; width: 520px; height: 520px; border-radius: 50%; background: radial-gradient(circle, oklch(0.72 0.08 152 / 0.16), transparent 70%); pointer-events: none;\"><\u002Fdiv>\n\n      <div style=\"position: relative; z-index: 1; max-width: 1180px; margin: 0 auto;\">\n        <div style=\"font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: oklch(0.72 0.08 152); margin-bottom: 22px;\">About Happy Beanie<\u002Fdiv>\n        <h1 style=\"font-family: 'DM Sans', sans-serif; font-weight: 700; letter-spacing: -0.042em; font-size: clamp(38px, 5.2vw, 74px); line-height: 0.99; margin: 0 0 22px; max-width: 18em;\">We started with one <span style=\"color: oklch(0.86 0.14 92);\">very good dog.<\u002Fspan><\u002Fh1>\n        <p style=\"font-size: 18px; line-height: 1.65; color: #B9AF9C; max-width: 36em; margin: 0 0 44px;\">Beanie was a fourteen-year-old lab mix who could not get up the back steps. Her owner ran a compounding pharmacy. Pick a year to see what happened next.<\u002Fp>\n\n        <div data-m=\"stack gap\" style=\"display: grid; grid-template-columns: minmax(0, 260px) minmax(0, 1fr); gap: 22px; align-items: stretch;\">\n          <div style=\"display: grid; align-content: start; gap: 8px;\">\n            <sc-for list=\"{{ abChapters }}\" as=\"ab\" hint-placeholder-count=\"4\">\n              <button sc-camel-on-click=\"{{ ab.pick }}\" sc-camel-on-mouse-enter=\"{{ ab.pick }}\" style=\"position: relative; text-align: left; cursor: pointer; border: 1px solid {{ ab.border }}; border-radius: 6px; background: {{ ab.bg }}; padding: 15px 18px 16px 22px; display: grid; gap: 5px; box-shadow: {{ ab.shadow }}; transform: {{ ab.lift }}; transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.35s ease, transform 0.35s cubic-bezier(0.2,0.7,0.2,1);\" style-hover=\"border-color: rgba(245,240,230,0.4);\">\n                <span aria-hidden=\"true\" style=\"position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; border-radius: 2px; background: oklch(0.86 0.14 92); transform: scaleY({{ ab.railScale }}); transform-origin: center; transition: transform 0.4s cubic-bezier(0.2,0.7,0.2,1);\"><\u002Fspan>\n                <span style=\"font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; color: {{ ab.yearColor }};\">{{ ab.year }}<\u002Fspan>\n                <span style=\"font-family: 'DM Sans', sans-serif; font-weight: 700; letter-spacing: -0.03em; font-size: 17px; line-height: 1.2; color: {{ ab.titleColor }};\">{{ ab.title }}<\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"position: relative; border: 1px solid rgba(245,240,230,0.16); border-radius: 8px; background: linear-gradient(#1D1913, #17140F); padding: 32px 34px 34px; overflow: hidden; box-shadow: 0 40px 70px -40px rgba(0,0,0,0.9), 0 1px 0 rgba(245,240,230,0.08) inset;\">\n            <div aria-hidden=\"true\" style=\"position: absolute; right: 26px; top: -10px; font-family: 'DM Sans', sans-serif; font-weight: 700; letter-spacing: -0.042em; font-size: 128px; line-height: 1; color: rgba(245,240,230,0.05); pointer-events: none;\">{{ abSel.year }}<\u002Fdiv>\n            <div style=\"position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-bottom: 20px; font-family: 'DM Mono', monospace; font-size: 8.5px; letter-spacing: 0.16em; text-transform: uppercase; color: #8A7F6E;\">\n              <span style=\"color: #17140F; background: oklch(0.86 0.14 92); padding: 4px 9px; border-radius: 2px;\">Chapter {{ abSel.chapNo }}<\u002Fspan>\n              <span>{{ abSel.year }}<\u002Fspan>\n              <span style=\"color: #DED5C4;\">{{ abSel.scale }}<\u002Fspan>\n            <\u002Fdiv>\n            <h2 style=\"position: relative; font-family: 'DM Sans', sans-serif; font-weight: 700; letter-spacing: -0.042em; font-size: clamp(26px, 2.8vw, 38px); line-height: 1.08; color: #F5F0E6; margin: 0 0 14px;\">{{ abSel.title }}<\u002Fh2>\n            <p style=\"position: relative; font-size: 16px; line-height: 1.7; color: #DED5C4; margin: 0 0 20px; max-width: 40em; text-wrap: pretty;\">{{ abSel.body }}<\u002Fp>\n            <div style=\"position: relative; border-top: 1px solid rgba(245,240,230,0.16); padding-top: 16px;\">\n              <div style=\"font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; color: oklch(0.72 0.08 152); margin-bottom: 9px;\">{{ abSel.evLabel }}<\u002Fdiv>\n              <p style=\"font-size: 14px; line-height: 1.6; color: #B9AF9C; margin: 0 0 8px; max-width: 44em;\">{{ abSel.evFinding }}<\u002Fp>\n              <div style=\"font-family: 'DM Mono', monospace; font-size: 10px; color: #8A7F6E;\">{{ abSel.evCite }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n    <section data-m=\"pad short\" style=\"position: relative; background: radial-gradient(110% 80% at 20% 0%, #FDFCF7 0%, #F5F0E6 46%, #EDE5D5 100%); padding: 96px 44px;\">\n\n      <div data-m=\"stack gap\" style=\"position: relative; z-index: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 68px; align-items: center; max-width: 1180px; margin: 0 auto;\">\n        <div style=\"height: 540px; border-radius: 8px; overflow: hidden; background: #EFE8D9; box-shadow: 0 40px 70px -40px rgba(23,20,15,0.5), 0 8px 18px -12px rgba(23,20,15,0.16);\"><image-slot id=\"hbv2-about-story\" placeholder=\"Founder with dog, documentary style\" style=\"width: 100%; height: 100%;\"><\u002Fimage-slot><\u002Fdiv>\n        <div>\n          <h2 style=\"font-family: 'DM Sans', sans-serif; font-weight: 700; letter-spacing: -0.042em; font-size: clamp(30px, 3.4vw, 48px); line-height: 1.05; margin: 0 0 22px;\">Human pharmacy standards, <span style=\"color: oklch(0.44 0.07 152);\">pointed at animals.<\u002Fspan><\u002Fh2>\n          <p style=\"font-size: 16px; line-height: 1.7; color: #554C40; margin: 0 0 18px;\">Most pet supplements are made by contract manufacturers with no analytical lab and no reason to prove what is in the bag. We came from the other side of that line: sterile human compounding, where every batch is assayed before it leaves the room.<\u002Fp>\n          <p style=\"font-size: 16px; line-height: 1.7; color: #554C40; margin: 0 0 30px;\">So Happy Beanie is small on purpose. We make to order, publish every certificate of analysis, and refuse to sell a format we cannot dose honestly by body weight.<\u002Fp>\n          <div data-m=\"creds\" style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; border-top: 1px solid #D5CAB5; padding-top: 26px;\">\n            <sc-for list=\"{{ credentials }}\" as=\"cr2\" hint-placeholder-count=\"4\">\n              <div>\n                <div style=\"font-family: 'DM Sans', sans-serif; font-weight: 700; letter-spacing: -0.042em; font-size: 34px; line-height: 1; margin-bottom: 8px; color: oklch(0.44 0.07 152);\">{{ cr2.n }}<\u002Fdiv>\n                <div style=\"font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: #6A6055; line-height: 1.5;\">{{ cr2.label }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n    <section data-m=\"pad short\" style=\"position: relative; background: radial-gradient(110% 80% at 80% 0%, #F4EEE1 0%, #EDE6D8 50%, #E5DCCA 100%); padding: 96px 44px;\">\n      <div style=\"position: relative; z-index: 1; max-width: 1180px; margin: 0 auto;\">\n        <h2 style=\"font-family: 'DM Sans', sans-serif; font-weight: 700; letter-spacing: -0.042em; font-size: clamp(30px, 3.4vw, 48px); line-height: 1.05; margin: 0 0 44px;\">The people <span style=\"color: oklch(0.44 0.07 152);\">in the room.<\u002Fspan><\u002Fh2>\n        <div data-m=\"stack gap\" style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 26px;\">\n          <sc-for list=\"{{ team }}\" as=\"tm\" hint-placeholder-count=\"3\">\n            <div style=\"background: #FCFAF4; border: 1px solid rgba(23,20,15,0.1); border-radius: 8px; padding: 14px 14px 26px; box-shadow: 0 30px 54px -34px rgba(23,20,15,0.36), 0 6px 14px -10px rgba(23,20,15,0.14), 0 1px 0 rgba(255,255,255,0.9) inset; transition: transform 0.35s cubic-bezier(0.2,0.7,0.2,1), box-shadow 0.35s ease;\" style-hover=\"transform: translateY(-5px); box-shadow: 0 42px 70px -34px rgba(23,20,15,0.42), 0 8px 18px -10px rgba(23,20,15,0.18);\">\n              <div style=\"height: 320px; border-radius: 5px; overflow: hidden; margin-bottom: 20px; background: #EFE8D9;\"><image-slot id=\"{{ tm.slot }}\" placeholder=\"{{ tm.ph }}\" style=\"width: 100%; height: 100%;\"><\u002Fimage-slot><\u002Fdiv>\n              <h3 style=\"font-family: 'DM Sans', sans-serif; font-weight: 700; letter-spacing: -0.042em; font-size: 25px; margin: 0 8px 6px;\">{{ tm.name }}<\u002Fh3>\n              <div style=\"font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: oklch(0.44 0.07 152); margin-bottom: 12px;\">{{ tm.role }}<\u002Fdiv>\n              <p style=\"font-size: 14px; line-height: 1.65; color: #554C40; margin: 0 8px;\">{{ tm.body }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section data-m=\"pad short\" style=\"position: relative; background: radial-gradient(110% 80% at 15% 0%, #F4EEE1 0%, #EDE6D8 50%, #E4DBC9 100%); padding: 96px 44px; border-top: 1px solid #DDD3C0;\">\n      <div data-m=\"stack gap\" style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 68px; align-items: center; max-width: 1180px; margin: 0 auto;\">\n        <div data-m=\"first\" style=\"height: 480px; border-radius: 8px; overflow: hidden; background: #EFE8D9; box-shadow: 0 40px 70px -40px rgba(23,20,15,0.5), 0 8px 18px -12px rgba(23,20,15,0.16);\"><image-slot id=\"hbv2-about-facility\" placeholder=\"Scottsdale compounding suite, wide shot\" style=\"width: 100%; height: 100%;\"><\u002Fimage-slot><\u002Fdiv>\n        <div>\n          <div style=\"font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: oklch(0.44 0.07 152); margin-bottom: 22px;\">The facility<\u002Fdiv>\n          <h2 style=\"font-family: 'DM Sans', sans-serif; font-weight: 700; letter-spacing: -0.042em; font-size: clamp(28px, 3.4vw, 48px); line-height: 1.05; margin: 0 0 20px;\">One suite in Scottsdale, <span style=\"color: oklch(0.44 0.07 152);\">nothing outsourced.<\u002Fspan><\u002Fh2>\n          <p style=\"font-size: 16px; line-height: 1.7; color: #554C40; margin: 0 0 26px; max-width: 32em;\">Nine hundred square feet, cGMP licensed, with a cold-blend room and an analytical bench. Every tin you receive was weighed, blended and sealed here — then held until its assay comes back clean.<\u002Fp>\n          <div style=\"display: grid; gap: 0; margin-bottom: 30px;\">\n            <sc-for list=\"{{ facilityFacts }}\" as=\"ff\" hint-placeholder-count=\"4\">\n              <div style=\"display: grid; grid-template-columns: auto 1fr; gap: 18px; padding: 15px 0; border-top: 1px solid #D5CAB5; align-items: baseline;\">\n                <span style=\"font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #8A7F6E; min-width: 96px;\">{{ ff.k }}<\u002Fspan>\n                <span style=\"font-size: 15px; line-height: 1.5;\">{{ ff.v }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ goContact }}\" style=\"font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; padding: 17px 28px; border: 1px solid #17140F; border-radius: 2px; background: transparent; color: #17140F; cursor: pointer;\" style-hover=\"background: #17140F; color: #F5F0E6;\">Book a tour<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section data-m=\"pad short\" style=\"position: relative; background: #17140F; color: #F5F0E6; padding: 92px 44px; overflow: hidden;\">\n      <div aria-hidden=\"true\" style=\"position: absolute; left: -120px; bottom: -180px; width: 520px; height: 520px; border-radius: 50%; background: radial-gradient(circle, oklch(0.86 0.14 92 / 0.12), transparent 70%); pointer-events: none;\"><\u002Fdiv>\n      <div data-m=\"stack gap\" style=\"position: relative; display: grid; grid-template-columns: 1fr auto; gap: 32px; align-items: center; max-width: 1180px; margin: 0 auto;\">\n        <div>\n          <h2 style=\"font-family: 'DM Sans', sans-serif; font-weight: 700; letter-spacing: -0.042em; font-size: clamp(30px, 3.6vw, 52px); line-height: 1.03; margin: 0 0 16px; max-width: 20em;\">Start with the animal <span style=\"color: oklch(0.86 0.14 92);\">in front of you.<\u002Fspan><\u002Fh2>\n          <p style=\"font-size: 16px; line-height: 1.7; color: #B9AF9C; margin: 0; max-width: 34em;\">Two formulations, dosed by weight, refundable for ninety days. Pick the one that matches your bean and we will do the rest.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display: flex; gap: 12px; flex-wrap: wrap;\">\n          <button sc-camel-on-click=\"{{ goShop }}\" style=\"font-family: 'DM Mono', monospace; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; padding: 18px 30px; border: none; border-radius: 2px; background: oklch(0.86 0.14 92); color: #17140F; cursor: pointer; white-space: nowrap;\" style-hover=\"background: #F5F0E6;\">Compare the two<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ goContact }}\" style=\"font-family: 'DM Mono', monospace; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; padding: 18px 30px; border: 1px solid rgba(245,240,230,0.3); border-radius: 2px; background: transparent; color: #F5F0E6; cursor: pointer; white-space: nowrap;\" style-hover=\"border-color: #F5F0E6;\">Ask a pharmacist<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isContact }}\" hint-placeholder-val=\"{{ false }}\">\n  <div>\n    <section data-m=\"pad short\" style=\"background: #17140F; color: #F5F0E6; padding: 82px 44px 70px;\">\n\n      <div style=\"position: relative; z-index: 1; max-width: 1180px; margin: 0 auto;\">\n        <div style=\"font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: oklch(0.72 0.08 152); margin-bottom: 22px;\">Contact<\u002Fdiv>\n        <h1 style=\"font-family: 'DM Sans', sans-serif; font-weight: 700; letter-spacing: -0.042em; font-size: clamp(38px, 5vw, 72px); line-height: 1.0; margin: 0 0 20px; max-width: 18em;\">A pharmacist answers <span style=\"color: oklch(0.86 0.14 92);\">the email.<\u002Fspan><\u002Fh1>\n        <p style=\"font-size: 17px; line-height: 1.65; color: #B9AF9C; max-width: 34em; margin: 0 0 30px;\">Dosing questions, a lot number to look up, a vet who wants the data — send it here. Weekday replies inside one business day.<\u002Fp>\n        <div style=\"display: inline-flex; align-items: center; gap: 11px; padding: 11px 18px; border: 1px solid rgba(245,240,230,0.24); border-radius: 0; font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #DED5C4;\">\n          <span style=\"position: relative; width: 8px; height: 8px;\">\n            <span style=\"position: absolute; inset: 0; border-radius: 50%; background: oklch(0.72 0.17 145);\"><\u002Fspan>\n            <span style=\"position: absolute; inset: -5px; border-radius: 50%; border: 1px solid oklch(0.72 0.17 145); animation: pingRing 2.4s ease-out infinite;\"><\u002Fspan>\n          <\u002Fspan>\n          {{ deskStatus }}\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n    <section data-m=\"pad short\" style=\"background: #FCFAF4; padding: 84px 44px 100px;\">\n\n      <div data-m=\"stack gap\" style=\"position: relative; z-index: 1; display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 64px; align-items: start; max-width: 1180px; margin: 0 auto;\">\n        <div>\n          <sc-if value=\"{{ sent }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"border: 1px solid oklch(0.44 0.07 152); border-radius: 0; padding: 40px 36px; background: #F5F0E6;\">\n              <div style=\"width: 44px; height: 44px; border-radius: 0; background: oklch(0.44 0.07 152); color: #F5F0E6; display: flex; align-items: center; justify-content: center; font-size: 20px; margin-bottom: 22px; animation: checkPop 0.5s cubic-bezier(0.2,0.7,0.2,1) both;\">✓<\u002Fdiv>\n              <div style=\"font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: oklch(0.44 0.07 152); margin-bottom: 14px;\">Message received · {{ ticketId }}<\u002Fdiv>\n              <p style=\"font-family: 'DM Sans', sans-serif; font-weight: 700; letter-spacing: -0.042em; font-size: 27px; line-height: 1.3; margin: 0 0 12px;\">Thanks {{ sentName }} — we have it. Expect a reply from a licensed pharmacist within one business day.<\u002Fp>\n              <button sc-camel-on-click=\"{{ resetForm }}\" style=\"font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500; background: transparent; border: none; padding: 0; color: oklch(0.44 0.07 152); cursor: pointer; border-bottom: 1px solid oklch(0.44 0.07 152);\">Send another<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ notSent }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"display: grid; gap: 22px;\">\n              <div>\n                <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 14px; margin-bottom: 10px; font-family: 'DM Sans', sans-serif; font-size: 13px; color: #6A6055;\">\n                  <span>{{ progressLabel }}<\u002Fspan><span style=\"color: oklch(0.44 0.07 152);\">{{ progressPct }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"height: 3px; background: #E4DBC9; overflow: hidden;\">\n                  <div style=\"height: 100%; width: {{ progressPct }}; background: oklch(0.44 0.07 152); transition: width 0.45s cubic-bezier(0.2,0.7,0.2,1);\"><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div data-m=\"stack\" style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px;\">\n                <label style=\"display: grid; gap: 8px; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; letter-spacing: 0; text-transform: none; color: #6A6055;\">Your name\n                  <input value=\"{{ fName }}\" sc-camel-on-change=\"{{ setName }}\" placeholder=\"Jamie Rivera\" style=\"border: 1px solid #E0D6C2; background: #F5F0E6; border-radius: 0; padding: 15px 16px; font-family: 'DM Sans', sans-serif; font-size: 15px; color: #17140F; transition: border-color 0.2s ease, box-shadow 0.25s ease, transform 0.25s ease;\" style-focus=\"outline: none; border-color: #17140F; box-shadow: 0 10px 24px rgba(23,20,15,0.09); transform: translateY(-1px);\">\n                <\u002Flabel>\n                <label style=\"display: grid; gap: 8px; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; letter-spacing: 0; text-transform: none; color: #6A6055;\">Email\n                  <input value=\"{{ fEmail }}\" sc-camel-on-change=\"{{ setEmail }}\" placeholder=\"you@email.com\" style=\"border: 1px solid #E0D6C2; background: #F5F0E6; border-radius: 0; padding: 15px 16px; font-family: 'DM Sans', sans-serif; font-size: 15px; color: #17140F; transition: border-color 0.2s ease, box-shadow 0.25s ease, transform 0.25s ease;\" style-focus=\"outline: none; border-color: #17140F; box-shadow: 0 10px 24px rgba(23,20,15,0.09); transform: translateY(-1px);\">\n                <\u002Flabel>\n              <\u002Fdiv>\n              <div>\n                <div style=\"font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; letter-spacing: 0; text-transform: none; color: #6A6055; margin-bottom: 12px;\">What is this about?<\u002Fdiv>\n                <div style=\"display: flex; gap: 8px; flex-wrap: wrap;\">\n                  <sc-for list=\"{{ topics }}\" as=\"tp\" hint-placeholder-count=\"5\">\n                    <button sc-camel-on-click=\"{{ tp.pick }}\" style=\"font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500; padding: 11px 17px; border-radius: 0; cursor: pointer; border: 1px solid {{ tp.border }}; background: {{ tp.bg }}; color: {{ tp.fg }}; transform: {{ tp.lift }}; box-shadow: {{ tp.shadow }}; transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease, transform 0.3s cubic-bezier(0.2,0.7,0.2,1), box-shadow 0.3s ease;\" style-hover=\"border-color: #17140F;\">{{ tp.label }}<\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"display: flex; gap: 10px; align-items: baseline; margin-top: 14px; padding: 14px 16px; background: #F5F0E6; border-left: 2px solid oklch(0.44 0.07 152); border-radius: 0;\">\n                  <span style=\"font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 700; color: oklch(0.44 0.07 152);\">Tip<\u002Fspan>\n                  <span style=\"font-size: 14px; line-height: 1.6; color: #554C40;\">{{ topicHint }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <label style=\"display: grid; gap: 8px; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; letter-spacing: 0; text-transform: none; color: #6A6055;\">Your animal\n                <input value=\"{{ fAnimal }}\" sc-camel-on-change=\"{{ setAnimal }}\" placeholder=\"Species, age, weight — e.g. cat, 9 yrs, 11 lb\" style=\"border: 1px solid #E0D6C2; background: #F5F0E6; border-radius: 0; padding: 15px 16px; font-family: 'DM Sans', sans-serif; font-size: 15px; color: #17140F; transition: border-color 0.2s ease, box-shadow 0.25s ease, transform 0.25s ease;\" style-focus=\"outline: none; border-color: #17140F; box-shadow: 0 10px 24px rgba(23,20,15,0.09); transform: translateY(-1px);\">\n              <\u002Flabel>\n              <label style=\"display: grid; gap: 8px; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; letter-spacing: 0; text-transform: none; color: #6A6055;\">\n                <span style=\"display: flex; justify-content: space-between; gap: 12px;\">Message <span style=\"font-weight: 400; color: {{ countColor }};\">{{ charCount }}<\u002Fspan><\u002Fspan>\n                <textarea value=\"{{ fMessage }}\" sc-camel-on-change=\"{{ setMessage }}\" rows=\"6\" placeholder=\"Tell us what is going on.\" style=\"border: 1px solid #E0D6C2; background: #F5F0E6; border-radius: 0; padding: 15px 16px; font-family: 'DM Sans', sans-serif; font-size: 15px; color: #17140F; resize: vertical; transition: border-color 0.2s ease, box-shadow 0.25s ease;\" style-focus=\"outline: none; border-color: #17140F; box-shadow: 0 10px 24px rgba(23,20,15,0.09);\"><\u002Ftextarea>\n              <\u002Flabel>\n              <div style=\"display: flex; align-items: center; gap: 18px; flex-wrap: wrap;\">\n                <button sc-camel-on-click=\"{{ submitForm }}\" style=\"font-family: 'DM Mono', monospace; font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; padding: 18px 34px; border: none; border-radius: 0; background: {{ sendBg }}; color: {{ sendFg }}; cursor: {{ sendCursor }}; opacity: {{ sendOpacity }}; transition: background 0.25s ease, opacity 0.25s ease, transform 0.3s cubic-bezier(0.2,0.7,0.2,1);\" style-hover=\"transform: translateY(-2px);\">{{ sendLabel }}<\u002Fbutton>\n                <span style=\"font-family: 'DM Sans', sans-serif; font-size: 13px; color: #6A6055;\">{{ sendNote }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"display: grid; gap: 1px; background: #E0D6C2; border: 1px solid #E0D6C2; border-radius: 0; overflow: hidden;\">\n          <sc-for list=\"{{ contactBlocks }}\" as=\"cb\" hint-placeholder-count=\"4\">\n            <div sc-camel-on-click=\"{{ cb.copy }}\" style=\"background: {{ cb.bg }}; padding: 26px 28px; cursor: {{ cb.cursor }}; transition: background 0.25s ease;\">\n              <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px;\">\n                <span style=\"font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: #8A7F6E;\">{{ cb.k }}<\u002Fspan>\n                <span style=\"font-family: 'DM Sans', sans-serif; font-size: 12px; color: oklch(0.44 0.07 152); opacity: {{ cb.hintOpacity }}; transition: opacity 0.25s ease;\">{{ cb.hint }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"font-family: 'DM Sans', sans-serif; font-weight: 700; letter-spacing: -0.042em; font-size: 23px; line-height: 1.25; margin-bottom: 6px;\">{{ cb.v }}<\u002Fdiv>\n              <div style=\"font-size: 14px; line-height: 1.6; color: #554C40;\">{{ cb.note }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section data-m=\"pad short\" style=\"background: #EDE6D8; padding: 92px 44px; border-top: 1px solid #DDD3C0;\">\n      <div style=\"max-width: 1180px; margin: 0 auto;\">\n        <div style=\"font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: oklch(0.44 0.07 152); margin-bottom: 20px;\">Before you write<\u002Fdiv>\n        <h2 style=\"font-family: 'DM Sans', sans-serif; font-weight: 700; letter-spacing: -0.042em; font-size: clamp(28px, 3.4vw, 48px); line-height: 1.04; margin: 0 0 40px; max-width: 20em;\">Most questions have <span style=\"color: oklch(0.44 0.07 152);\">a short answer.<\u002Fspan><\u002Fh2>\n        <div style=\"display: grid; gap: 0; border-top: 1px solid #D5CAB5;\">\n          <sc-for list=\"{{ faqs }}\" as=\"q3\" hint-placeholder-count=\"4\">\n            <div style=\"border-bottom: 1px solid #D5CAB5;\">\n              <button sc-camel-on-click=\"{{ q3.toggle }}\" style=\"width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 20px; text-align: left; padding: 22px 4px; background: transparent; border: none; cursor: pointer; font-family: 'DM Sans', sans-serif; font-weight: 700; letter-spacing: -0.042em; font-size: 23px; color: #17140F;\">{{ q3.q }}<span style=\"font-family: 'DM Mono', monospace; font-size: 16px; color: #8A7F6E;\">{{ q3.sign }}<\u002Fspan><\u002Fbutton>\n              <div style=\"max-height: {{ q3.maxHeight }}; opacity: {{ q3.opacity }}; overflow: hidden; transition: max-height 0.4s cubic-bezier(0.2,0.7,0.2,1), opacity 0.3s ease;\">\n                <p style=\"font-size: 15px; line-height: 1.7; color: #554C40; margin: 0 0 24px; max-width: 44em;\">{{ q3.a }}<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section data-m=\"pad short\" style=\"background: #FCFAF4; padding: 92px 44px;\">\n      <div data-m=\"stack gap\" style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; max-width: 1180px; margin: 0 auto;\">\n        <sc-for list=\"{{ partnerBlocks }}\" as=\"pb\" hint-placeholder-count=\"2\">\n          <div data-rv=\"1\" data-rv-delay=\"{{ pb.delay }}\" data-m=\"stack\" style=\"display: grid; grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr); align-items: stretch; background: #F5F0E6; border: 1px solid #E0D6C2; border-radius: 0; overflow: hidden; opacity: 0; transform: translateY(22px); transition: opacity 0.6s ease, transform 0.7s cubic-bezier(0.2,0.7,0.2,1), box-shadow 0.35s ease;\" style-hover=\"box-shadow: 0 22px 46px rgba(23,20,15,0.12);\">\n            <div data-m=\"auto\" style=\"min-height: 250px;\"><image-slot id=\"{{ pb.slot }}\" placeholder=\"{{ pb.ph }}\" style=\"width: 100%; height: 100%;\"><\u002Fimage-slot><\u002Fdiv>\n            <div style=\"padding: 30px 30px 32px;\">\n              <div style=\"font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: oklch(0.44 0.07 152); margin-bottom: 12px;\">{{ pb.tag }}<\u002Fdiv>\n              <h3 style=\"font-family: 'DM Sans', sans-serif; font-weight: 700; letter-spacing: -0.042em; font-size: 27px; line-height: 1.1; margin: 0 0 12px;\">{{ pb.title }}<\u002Fh3>\n              <p style=\"font-size: 14px; line-height: 1.65; color: #554C40; margin: 0 0 20px;\">{{ pb.body }}<\u002Fp>\n              <span style=\"font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 700; color: #17140F; border-bottom: 1px solid #17140F; padding-bottom: 3px;\">{{ pb.cta }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n\n  <sc-if value=\"{{ isCerts }}\" hint-placeholder-val=\"{{ false }}\">\n  <div>\n    <section data-m=\"pad short\" style=\"position: relative; background: #17140F; color: #F5F0E6; padding: 82px 44px 70px; overflow: hidden;\">\n      <div id=\"ctPings\" aria-hidden=\"true\" data-m=\"hide\" style=\"position: absolute; inset: 0; pointer-events: none;\"><\u002Fdiv>\n      <div style=\"position: relative; z-index: 1; max-width: 1180px; margin: 0 auto;\">\n        <div style=\"display: flex; align-items: center; gap: 10px; font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: oklch(0.72 0.08 152); margin-bottom: 22px;\"><span style=\"width: 6px; height: 6px; border-radius: 50%; background: oklch(0.72 0.08 152); animation: qzBlip 1.6s ease-in-out infinite;\"><\u002Fspan>Certificate library · <span id=\"ctCount\" style=\"color: #8A7F6E;\">live assay feed<\u002Fspan><\u002Fdiv>\n        <h1 style=\"font-family: 'DM Sans', sans-serif; font-weight: 700; letter-spacing: -0.042em; font-size: clamp(38px, 5vw, 72px); line-height: 1.0; margin: 0 0 20px; max-width: 18em;\">Every lot, <span style=\"color: oklch(0.86 0.14 92);\">including the bad one.<\u002Fspan><\u002Fh1>\n        <p style=\"font-size: 17px; line-height: 1.65; color: #B9AF9C; max-width: 34em; margin: 0;\">Independent assay results for each batch we have made, published by lot number and kept online for the life of the product. Open any report — the destroyed lot stays here too.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsection>\n    <section data-m=\"pad short\" style=\"position: relative; background: radial-gradient(120% 80% at 50% 0%, #FDFCF7 0%, #FCFAF4 44%, #F1EADB 100%); padding: 62px 44px 100px;\">\n      <div style=\"position: relative; max-width: 1180px; margin: 0 auto;\">\n        <div data-m=\"ctstats hide\" style=\"display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: #E0D6C2; border: 1px solid rgba(23,20,15,0.1); border-radius: 8px; overflow: hidden; margin-bottom: 26px; box-shadow: 0 26px 48px -30px rgba(23,20,15,0.34), 0 6px 14px -10px rgba(23,20,15,0.14), 0 1px 0 rgba(255,255,255,0.9) inset;\">\n          <div style=\"background: #FCFAF4; padding: 20px 22px;\">\n            <div style=\"font-family: 'DM Sans', sans-serif; font-weight: 700; letter-spacing: -0.042em; font-size: 30px; line-height: 1; margin-bottom: 8px; color: #17140F;\">4<\u002Fdiv>\n            <div style=\"font-family: 'DM Mono', monospace; font-size: 8.5px; letter-spacing: 0.16em; text-transform: uppercase; line-height: 1.5; color: #8A7F6E;\">Lots in the library<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background: #FCFAF4; padding: 20px 22px;\">\n            <div style=\"font-family: 'DM Sans', sans-serif; font-weight: 700; letter-spacing: -0.042em; font-size: 30px; line-height: 1; margin-bottom: 8px; color: oklch(0.44 0.07 152);\">98.4%<\u002Fdiv>\n            <div style=\"font-family: 'DM Mono', monospace; font-size: 8.5px; letter-spacing: 0.16em; text-transform: uppercase; line-height: 1.5; color: #8A7F6E;\">Panels within spec<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background: #FCFAF4; padding: 20px 22px;\">\n            <div style=\"font-family: 'DM Sans', sans-serif; font-weight: 700; letter-spacing: -0.042em; font-size: 30px; line-height: 1; margin-bottom: 8px; color: oklch(0.52 0.16 32);\">1<\u002Fdiv>\n            <div style=\"font-family: 'DM Mono', monospace; font-size: 8.5px; letter-spacing: 0.16em; text-transform: uppercase; line-height: 1.5; color: #8A7F6E;\">Lot destroyed, published<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background: #FCFAF4; padding: 20px 22px;\">\n            <div style=\"font-family: 'DM Sans', sans-serif; font-weight: 700; letter-spacing: -0.042em; font-size: 30px; line-height: 1; margin-bottom: 8px; color: #17140F;\">13 Jul 2026<\u002Fdiv>\n            <div style=\"font-family: 'DM Mono', monospace; font-size: 8.5px; letter-spacing: 0.16em; text-transform: uppercase; line-height: 1.5; color: #8A7F6E;\">Most recent assay released<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; align-items: baseline; gap: 14px; margin-bottom: 16px;\">\n          <h2 style=\"font-family: 'DM Sans', sans-serif; font-weight: 700; letter-spacing: -0.042em; font-size: clamp(21px, 2.2vw, 30px); line-height: 1.1; margin: 0;\">{{ certTitle }}<\u002Fh2>\n          <span aria-hidden=\"true\" style=\"flex: 1; height: 1px; background: #DDD3C0; min-width: 16px;\"><\u002Fspan>\n          <span style=\"font-family: 'DM Mono', monospace; font-size: 9.5px; letter-spacing: 0.14em; text-transform: uppercase; color: #8A7F6E; white-space: nowrap;\">{{ certCount }}<\u002Fspan>\n        <\u002Fdiv>\n        <div data-m=\"ctfilters\" style=\"display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 34px;\">\n          <sc-for list=\"{{ certFilters }}\" as=\"cf\" hint-placeholder-count=\"3\">\n            <button sc-camel-on-click=\"{{ cf.pick }}\" style=\"font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; padding: 12px 20px; border-radius: 999px; cursor: pointer; border: 1px solid {{ cf.border }}; background: {{ cf.bg }}; color: {{ cf.fg }}; box-shadow: 0 12px 22px -16px rgba(23,20,15,0.4), 0 1px 0 rgba(255,255,255,0.85) inset; transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease, transform 0.25s cubic-bezier(0.2,0.7,0.2,1), box-shadow 0.25s ease;\" style-hover=\"transform: translateY(-2px); box-shadow: 0 18px 30px -18px rgba(23,20,15,0.45);\">{{ cf.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"position: relative;\">\n        <div aria-hidden=\"true\" style=\"position: absolute; left: 14px; right: 14px; bottom: -9px; height: 22px; border-radius: 0 0 8px 8px; background: #EFE8D9; border: 1px solid rgba(23,20,15,0.08); border-top: none; box-shadow: 0 16px 28px -22px rgba(23,20,15,0.4);\"><\u002Fdiv>\n        <div aria-hidden=\"true\" style=\"position: absolute; left: 7px; right: 7px; bottom: -4px; height: 16px; border-radius: 0 0 8px 8px; background: #F2EBDC; border: 1px solid rgba(23,20,15,0.08); border-top: none;\"><\u002Fdiv>\n        <div style=\"position: relative; border: 1px solid rgba(23,20,15,0.12); border-radius: 8px; background: #F5F0E6; overflow: hidden; box-shadow: 0 34px 60px -34px rgba(23,20,15,0.38), 0 8px 18px -12px rgba(23,20,15,0.16), 0 1px 0 rgba(255,255,255,0.9) inset;\">\n          <div data-m=\"hide\" style=\"display: grid; grid-template-columns: 1.1fr 1fr 0.9fr 0.9fr 0.7fr; gap: 20px; padding: 18px 28px; background: linear-
